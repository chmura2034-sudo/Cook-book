<!DOCTYPE html>
<html lang="pl">
<head>
<link id="favicon" rel="icon" type="image/png" href="/static/logo.png">
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<title>Dodaj przepis</title>

</head>
<body>
<header>
    <div class="header-left"></div>
    <div class="header-title"><a href="/">CookBook</a></div>
    <button id="themeToggle">🌙</button>
</header>
<h1>Dodaj nowy przepis</h1>
<div id="editModeBanner" style="display:none;margin-bottom:16px;padding:8px 16px;background:var(--card-bg);border:1px solid var(--border);border-radius:6px;max-width:600px;">
    <b>Tryb edycji przepisu</b>
    <button id="deleteRecipeBtn" class="btn-primary" style="background:#e53e3e;float:right;">Usuń przepis</button>
</div>

<form id="recipeForm">

    <!-- Tytuł i opis -->
    <h2>Podstawowe informacje</h2>
    <label>Tytuł przepisu</label>
    <input type="text" id="title" required>

    <label>Opis</label>
    <textarea id="description" rows="4"></textarea>

    <!-- Składniki -->
    <h2>Składniki</h2>
    <div id="ingredients"></div>
    <button type="button" onclick="addIngredient()">Dodaj składnik</button>

    <!-- Kroki -->
    <h2>Kroki</h2>
    <div id="steps"></div>
    <button type="button" onclick="addStep()">Dodaj krok</button>

    <!-- Zdjęcia -->
    <h2>Zdjęcia</h2>
    <input type="file" id="photos" multiple accept="image/*">

    <!-- Tagi -->
<h2 class="accordion">Tagi</h2>
<div class="panel">
    <div class="tag-list">
    </div>
</div>


    <!-- Rozmiar naczynia -->
<h2 class="accordion">Rozmiar naczynia</h2>
<div class="panel">
    <label>
        Ilość porcji
        <input type="number" id="servings" min="1">
    </label><br>

    <label>
        Brak formy
        <input type="radio" name="sizeType" value="none" checked>
    </label><br>

    <label>
        Okrągła forma
        <input type="radio" name="sizeType" value="round">
    </label>
    <input type="text" id="diameter" placeholder="Średnica (cm)" disabled>

    <label>
        Prostokątna forma
        <input type="radio" name="sizeType" value="rect">
    </label>
    <div class="row">
        <input type="text" id="length" placeholder="Długość (cm)" disabled>
        <input type="text" id="width" placeholder="Szerokość (cm)" disabled>
    </div>

</div>


    <button type="submit">Zapisz przepis</button>
<button type="button" id="cancelEditBtn" style="display:none;margin-left:12px;">Anuluj edycję</button>
</form>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    // --- DETEKCJA TRYBU EDYCJI ---
    const urlParts = window.location.pathname.split("/");
    const recipeId = urlParts.includes("edit") ? urlParts.pop() : null;
    const editModeBanner = document.getElementById("editModeBanner");
    const deleteRecipeBtn = document.getElementById("deleteRecipeBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    if (recipeId) {
        editModeBanner.style.display = "block";
        cancelEditBtn.style.display = "inline-block";
        // Pobierz dane przepisu i wypełnij formularz
        const token = localStorage.getItem("token");
        const res = await fetch(`/api/recipe/${recipeId}`, {
            headers: {Authorization: "Bearer " + token}
        });
        if (res.ok) {
            const r = await res.json();
            document.getElementById("title").value = r.title || "";
            document.getElementById("description").value = r.description || "";
            document.getElementById("servings").value = r.servings || 1;
            // Składniki
            document.getElementById("ingredients").innerHTML = "";
            (r.ingredients||[]).forEach(i => addIngredient(i.name, i.amount, i.unit));
            // Kroki
            document.getElementById("steps").innerHTML = "";
            (r.steps||[]).forEach(s => addStep(s.instruction));
            // Tagi
            await loadTags();
            document.querySelectorAll(".tag-list input").forEach(cb => {
                cb.checked = (r.tags||[]).includes(cb.value);
            });
            // Rozmiar naczynia
            if (r.size && r.size.type) {
                document.querySelector(`input[name='sizeType'][value='${r.size.type}']`).checked = true;
                if (r.size.type === "round") document.getElementById("diameter").value = r.size.diameter || "";
                if (r.size.type === "rect") {
                    document.getElementById("length").value = r.size.length || "";
                    document.getElementById("width").value = r.size.width || "";
                }
            }
        }
    }

    // --- AUTORYZACJA ---
    const token = localStorage.getItem("token");
    if (!token) {
        window.location.href = "/account";
        return;
    }

    // --- TAGI ---
    await loadTags();

    // --- OBSŁUGA ZMIANY ROZMIARU NACZYNIA ---
    document.querySelectorAll("input[name='sizeType']").forEach(radio => {
        radio.addEventListener("change", () => {
            const type = document.querySelector("input[name='sizeType']:checked").value;

            document.getElementById("diameter").disabled = type !== "round";
            document.getElementById("length").disabled = type !== "rect";
            document.getElementById("width").disabled = type !== "rect";
        });
    });

    // --- SUBMIT FORMULARZA ---
    document.getElementById("recipeForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!validateRecipe()) return;

        const data = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value,
            servings: document.getElementById("servings").value ? parseInt(document.getElementById("servings").value, 10) : null,
            ingredients: [],
            steps: [],
            tags: [],
            size: {}
        };

        document.querySelectorAll(".ing-name").forEach((el, i) => {
            data.ingredients.push({
                name: el.value,
                amount: document.querySelectorAll(".ing-amount")[i].value,
                unit: document.querySelectorAll(".ing-unit")[i].value
            });
        });

        document.querySelectorAll(".step-text").forEach(el => {
            data.steps.push(el.value);
        });

        document.querySelectorAll(".tag-list input:checked").forEach(el => {
            data.tags.push(el.value);
        });

        const sizeType = document.querySelector("input[name='sizeType']:checked").value;

        if (sizeType === "round") {
            data.size = {
                type: "round",
                diameter: document.getElementById("diameter").value
            };
        } else if (sizeType === "rect") {
            data.size = {
                type: "rect",
                length: document.getElementById("length").value,
                width: document.getElementById("width").value
            };
        } else {
            data.size = { type: "none" };
        }

        const formData = new FormData();
        formData.append("data", JSON.stringify(data));

        const photos = document.getElementById("photos").files;
        for (let i = 0; i < photos.length; i++) {
            formData.append("photos", photos[i]);
        }

                let res, result;
                if (recipeId) {
                    // EDYCJA
                    res = await fetch(`/api/recipe/${recipeId}`, {
                        method: "PUT",
                        headers: {"Authorization": "Bearer " + token},
                        body: formData
                    });
                } else {
                    // DODAWANIE
                    res = await fetch("/api/add_recipe", {
                        method: "POST",
                        headers: {"Authorization": "Bearer " + token},
                        body: formData
                    });
                }
                result = await res.json();
                if (!res.ok) {
                    alert("Błąd: " + result.error);
                    return;
                }
                alert(recipeId ? "Przepis zaktualizowany!" : "Przepis dodany!");
                if (recipeId) window.location.href = `/recipe/${recipeId}`;
        // --- USUWANIE PRZEPISU ---
        if (recipeId) {
            deleteRecipeBtn.addEventListener("click", async () => {
                if (!confirm("Czy na pewno chcesz usunąć ten przepis?")) return;
                const token = localStorage.getItem("token");
                const res = await fetch(`/api/recipe/${recipeId}`, {
                    method: "DELETE",
                    headers: {"Authorization": "Bearer " + token}
                });
                if (res.ok) {
                    alert("Przepis usunięty!");
                    window.location.href = "/";
                } else {
                    const err = await res.json();
                    alert("Błąd: " + (err.error||"Nieznany"));
                }
            });
            cancelEditBtn.addEventListener("click", () => {
                window.location.href = "/add_recipe";
            });
        }
    });

    // --- AKORDEONY ---
    document.querySelectorAll(".accordion").forEach(acc => {
        acc.addEventListener("click", () => {
            const panel = acc.nextElementSibling;
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        });
    });

});

// --- FUNKCJA ŁADOWANIA TAGÓW ---
async function loadTags() {
    const res = await fetch("/api/tags");
    const data = await res.json();

    const container = document.querySelector(".tag-list");
    container.innerHTML = "";

    data.tags.forEach(tag => {
        const label = document.createElement("label");
        label.classList.add("tag-item");

        label.innerHTML = `
            ${tag}
            <input type="checkbox" value="${tag}">
        `;

        container.appendChild(label);
    });
}

// --- DODAWANIE SKŁADNIKÓW ---
function addIngredient() {
    const container = document.getElementById("ingredients");

    const row = document.createElement("div");
    row.classList.add("ingredient-row");

    row.innerHTML = `
        <input type="text" class="ing-name" placeholder="Nazwa składnika">

        <input type="number" class="ing-amount" placeholder="Ilość" min="0.1" step="0.1">

        <select class="ing-unit">
            <option value="g">g</option>
            <option value="ml">ml</option>
            <option value="szt">szt</option>
        </select>

        <button type="button" class="remove-btn" onclick="removeIngredient(this)">Usuń</button>
    `;

    container.appendChild(row);
}

function removeIngredient(btn) {
    btn.parentElement.remove();
}


// --- DODAWANIE KROKÓW ---
function addStep() {
    const container = document.getElementById("steps");

    const row = document.createElement("div");
    row.classList.add("step-row");

    row.innerHTML = `
        <span class="step-number"></span>
        <textarea class="step-text" placeholder="Opis kroku"></textarea>
        <button type="button" class="remove-btn" onclick="removeStep(this)">Usuń</button>
    `;

    container.appendChild(row);
    renumberSteps();
}

function removeStep(btn) {
    btn.parentElement.remove();
    renumberSteps();
}


function renumberSteps() {
    const steps = document.querySelectorAll(".step-row");
    steps.forEach((row, index) => {
        const label = row.querySelector(".step-number");
        label.textContent = (index + 1) + ".";
    });
}

function validateRecipe() {
    const title = document.getElementById("title").value.trim();
    if (!title || title.length < 1 || title.length > 200) {
        alert("Tytuł musi zawierać 1-200 znaków");
        return false;
    }

    const description = document.getElementById("description").value.trim();
    if (description.length > 2000) {
        alert("Opis nie może przekroczyć 2000 znaków");
        return false;
    }
    
    const names = document.querySelectorAll(".ing-name");
    const amounts = document.querySelectorAll(".ing-amount");
    const units = document.querySelectorAll(".ing-unit");

    if (names.length === 0) {
        alert("Musisz dodać przynajmniej jeden składnik");
        return false;
    }

    for (let i = 0; i < names.length; i++) {
        const name = names[i].value.trim();
        if (!name || name.length > 150) {
            alert("Nazwa składnika w wierszu " + (i + 1) + " musi mieć 1-150 znaków");
            return false;
        }
        
        const amount = parseFloat(amounts[i].value);
        if (isNaN(amount) || amount <= 0) {
            alert("Ilość składnika w wierszu " + (i + 1) + " musi być > 0");
            return false;
        }
        
        if (!units[i].value.trim()) {
            alert("Wybierz jednostkę składnika w wierszu " + (i + 1));
            return false;
        }
    }

    const steps = document.querySelectorAll(".step-text");
    if (steps.length === 0) {
        alert("Musisz dodać przynajmniej jeden krok");
        return false;
    }
    
    for (let i = 0; i < steps.length; i++) {
        const step = steps[i].value.trim();
        if (!step || step.length > 1000) {
            alert("Krok " + (i + 1) + " musi mieć 1-1000 znaków");
            return false;
        }
    }

    const servingsEl = document.getElementById("servings");
    if (servingsEl && servingsEl.value) {
        const sv = Number(servingsEl.value);
        if (!Number.isInteger(sv) || sv < 1) {
            alert("Ilość porcji musi być liczbą całkowitą >= 1");
            return false;
        }
    }

    const sizeType = document.querySelector("input[name='sizeType']:checked").value;
    if (sizeType === "round") {
        const diameter = parseFloat(document.getElementById("diameter").value);
        if (isNaN(diameter) || diameter <= 0 || diameter > 100) {
            alert("Średnica musi być między 0 a 100 cm");
            return false;
        }
    } else if (sizeType === "rect") {
        const length = parseFloat(document.getElementById("length").value);
        const width = parseFloat(document.getElementById("width").value);
        if (isNaN(length) || length <= 0 || length > 100) {
            alert("Długość musi być między 0 a 100 cm");
            return false;
        }
        if (isNaN(width) || width <= 0 || width > 100) {
            alert("Szerokość musi być między 0 a 100 cm");
            return false;
        }
    }

    return true;
}


    const toggle = document.getElementById("themeToggle");
    const body = document.body;

    // Wczytaj zapisany motyw
    if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark");
        toggle.textContent = "☀️";
    }

    toggle.addEventListener("click", () => {
        body.classList.toggle("dark");

        if (body.classList.contains("dark")) {
            localStorage.setItem("theme", "dark");
            toggle.textContent = "☀️";
        } else {
            localStorage.setItem("theme", "light");
            toggle.textContent = "🌙";
        }
    });
</script>


</body>
</html>
